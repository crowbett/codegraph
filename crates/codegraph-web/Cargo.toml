[package]
name = "codegraph-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
codegraph = { path = "../..", default-features = false }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
tree-sitter-language = { path = "vendor/tree-sitter-language" }

# Accuracy benchmark corpus. Every repo is pinned to a commit and cloned into
# bench/.cache/corpus/<name> (gitignored); local repos are cloned from their working
# copy, so the benchmark never writes into them. `lang` picks the SCIP indexer.

[tools]
scip-go = "v0.2.7"            # go install github.com/scip-code/scip-go/cmd/scip-go
scip-typescript = "0.4.0"     # npm @sourcegraph/scip-typescript
scip-python = "0.6.6"         # npm @sourcegraph/scip-python (Windows path.sep bug patched locally)
# rust-analyzer comes from the active rustup toolchain (`rust-analyzer scip`).

[[repo]]
name = "chi"
lang = "go"
url = "https://github.com/go-chi/chi"
rev = "3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc"

[[repo]]
name = "pulse"
lang = "go"
local = "~/dev/go/pulse"
rev = "2398e3b9bb419d84e659722dcbfd3c4e8fdee92c"

[[repo]]
name = "keep"
lang = "go"
local = "~/dev/go/keep"
rev = "0d743de1dc96ed4f3583cae3944fc1d94cd8ab8d"

[[repo]]

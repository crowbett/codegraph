[package]
name = "codegraph-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Accuracy and scale benchmarks for codegraph (not shipped)."

[[bin]]
name = "codegraph-bench"
path = "src/main.rs"

[dependencies]
codegraph = { path = ".." }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
protobuf = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
scip = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

# Standalone: not part of codegraph's build or its release artifacts.
[workspace]

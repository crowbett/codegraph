[package]
name = "codegraph"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "A tree-sitter symbol + call graph of every repo you own, served to AI agents over MCP."
license = "MIT"
authors = ["crowbett"]
repository = "https://github.com/crowbett/codegraph"
readme = "README.md"
keywords = ["tree-sitter", "call-graph", "mcp", "code-navigation", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false
build = "build.rs"

[lib]
name = "codegraph"
path = "src/lib.rs"

[[bin]]
name = "codegraph"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
ctrlc = "3.5.2"
ignore = "0.4.33"
notify = "8.2.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
streaming-iterator = "0.1.9"
thiserror = "2.0.21"
toml = "1.1.6"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
format_push_string = "allow"
similar_names = "allow"
many_single_char_names = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

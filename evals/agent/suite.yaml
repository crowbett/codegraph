# GENERATED by evals/agent/gen.py from evals/agent/cases.py - edit cases.py, then run
#   python evals/agent/gen.py
# Agent eval: the same code questions answered by an agent with grep-only tools vs
# codegraph tools. `cgagent` is the agent proxy (evals/agent/proxy.py), an
# openai-compatible provider whose models are the two arms. Every expected answer was
# verified against SCIP ground truth or by reading the source (see cases.py `truth`).
name: codegraph-agent
description: >
  Code-navigation questions over the pinned codegraph accuracy corpus
  (Go/Rust/TypeScript/Python), answered by an agent loop with grep-only tools
  vs codegraph tools. Compare pass rate and total tokens per arm.

prompt:
  template: |
    [{{ qid }}] {{ question }}

    Answer with a short list of names (one per line), nothing else.

models:
  - cgagent:grep
  - cgagent:codegraph

params:
  temperature: 0
  max_tokens: 1024

threshold: 1.0

dataset:
  cases:
    - id: Q01
      tags: [go, chi, callers]
      vars:
        qid: Q01
        question: "In the chi repo, which functions or methods call `patNextSegment`?"
      graders:
        - {type: contains, mode: all, value: ["InsertRoute", "addChild", "patParamKeys"]}
    - id: Q02
      tags: [go, chi, implementations]
      vars:
        qid: Q02
        question: "In chi's middleware package, which concrete types implement the `WrapResponseWriter` interface?"
      graders:
        - {type: contains, mode: all, value: ["basicWriter", "flushWriter", "hijackWriter", "flushHijackWriter", "httpFancyWriter", "http2FancyWriter"]}
    - id: Q03
      tags: [go, chi, methods]
      vars:
        qid: Q03
        question: "List the methods defined on chi's routing `Context` type (the struct in the chi package)."
      graders:
        - {type: contains, mode: all, value: ["Reset", "Clone", "URLParam", "RoutePattern"]}
    - id: Q04
      tags: [go, pulse, callers]
      vars:
        qid: Q04
        question: "In pulse, which functions or methods call the engine's `enabledRule` method?"
      graders:
        - {type: contains, mode: all, value: ["Trigger", "Webhook", "chain"]}
    - id: Q05
      tags: [go, pulse, callees]
      vars:
        qid: Q05
        question: "In pulse, what functions and methods defined in the pulse module does `Engine.dispatch` call directly? Ignore the standard library."
      graders:
        - {type: contains, mode: all, value: ["IsEnabled", "Render", "Truthy", "Publish", "Summary", "worker"]}
    - id: Q06
      tags: [go, pulse, impact]
      vars:
        qid: Q06
        question: "In pulse, if `config.IsLoopbackHost` changes its behavior, which functions or methods depend on it directly (call it)?"
      graders:
        - {type: contains, mode: all, value: ["Listen", "loopbackHost", "server"]}
    - id: Q07
      tags: [go, keep, callers]
      vars:
        qid: Q07
        question: "In keep's HTTP server, which functions or methods call `originAllowed`?"
      graders:
        - {type: contains, mode: all, value: ["cors", "handleAdd", "handlePreflight", "tokenOK"]}
    - id: Q08
      tags: [go, keep, semantic]
      vars:
        qid: Q08
        question: "In keep, find the function that decides whether an IP address is publicly routable (the core check of the SSRF guard). Name it and the non-test functions or methods that call it."
      graders:
        - {type: contains, mode: all, value: ["IsPublic", "CheckHost", "Control", "dial"]}
    - id: Q09
      tags: [go, keep, definition]
      vars:
        qid: Q09
        question: "In keep, in which file is the function `splitTags` defined? Give the repo-relative path."
      graders:

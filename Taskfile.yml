version: "3"

vars:
  APP: codegraph
  VERSION: 0.1.1
  ZIP: '{{.APP}}-{{.VERSION}}-windows-amd64.zip'

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Debug build
    cmds:
      - cargo build

  test:
    desc: Unit + integration tests (fixtures, incremental, graph, CLI, MCP stdio, self-index)
    cmds:
      - cargo test --all-targets

  snapshots:
    desc: Re-record insta fixture snapshots (review the diff before committing)
    env:
      INSTA_UPDATE: always
    cmds:
      - cargo test --test lang

  lint:
    desc: rustfmt check + clippy with warnings as errors
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --all-targets -- -D warnings

  fmt:
    cmds:
      - cargo fmt --all

  ci:
    desc: Definition of done (fmt, clippy, test)
    cmds:
      - task: lint
      - task: test

  index:
    desc: Index the configured roots with the release binary
    cmds:
      - cargo run --release -- index -v

  release:
    desc: Optimised build zipped as dist/{{.ZIP}}
    cmds:
      - cargo build --release --locked
      - pwsh -NoProfile -Command "New-Item -ItemType Directory -Force dist | Out-Null; Compress-Archive -Force -Path target/release/{{.APP}}.exe, README.md, LICENSE -DestinationPath dist/{{.ZIP}}; (Get-FileHash dist/{{.ZIP}} -Algorithm SHA256).Hash"

  clean:
    cmds:
      - cargo clean

  bench:prepare:
    desc: Clone the pinned accuracy corpus and build SCIP ground truth into .cache/bench
    dir: bench
    cmds:
      - cargo run --release -q -- prepare

  bench:accuracy:
    desc: Score codegraph against SCIP ground truth (delta vs the frozen baseline; misses in .cache/bench/report)
    dir: bench
    cmds:
      - task: bench:prepare
      - cargo run --release -q -- accuracy --report --baseline baseline/accuracy.json --out ../.cache/bench/results.json

  bench:scale:
    desc: Cold / no-op / 1-file index timings on Linux (+ rust-lang/rust combined); JSON in .cache/bench/scale.json
    dir: bench
    cmds:
      - cargo run --release -q -- scale {{.CLI_ARGS}}

  bench:record:
    desc: Record the current accuracy run in bench/results/accuracy.json and docs/ACCURACY.md
    dir: bench
    cmds:
      - task: bench:prepare
      - cargo run --release -q -- accuracy --baseline baseline/accuracy.json --out results/accuracy.json --write-docs

  eval:agent:
    desc: Agent eval (grep-only vs codegraph tools) via evalrig + its fake LLM; no API key, no spend; rewrites docs/AGENT-EVAL.md results
    cmds:
      - python evals/agent/run.py {{.CLI_ARGS}}

  eval:agent:real:
    desc: Agent eval against claude-haiku-4-5-20251001 (needs ANTHROPIC_API_KEY); prints a cost projection, then runs under a hard $5 proxy budget
    cmds:
      - python evals/agent/run.py --estimate
      - python evals/agent/run.py --real --budget-usd 5 {{.CLI_ARGS}}

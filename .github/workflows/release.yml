name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --locked
      - name: package
        id: pkg
        shell: pwsh
        run: |
          $crate = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -ne $crate) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $crate" }
          } else {
            $version = $crate
          }
          $zip = "codegraph-$version-windows-amd64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target/release/codegraph.exe, README.md, LICENSE -DestinationPath "dist/$zip"
          $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("dist/$zip.sha256", "$hash  $zip`n")
          Get-Content "dist/$zip.sha256"
          "zip=dist/$zip" >> $env:GITHUB_OUTPUT
      - name: upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-windows-amd64
          path: ${{ steps.pkg.outputs.zip }}
      - name: github release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
          generate_release_notes: true

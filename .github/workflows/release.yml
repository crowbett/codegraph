name: release

# A pushed `v*` tag builds every target and creates a DRAFT GitHub release with the
# archives and SHA256SUMS; publishing the draft is a manual step (see docs/INSTALL.md).
# workflow_dispatch builds the same archives as workflow artifacts only (dry run).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts only; never create a release
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            arch: amd64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            arch: arm64
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache: release builds are hermetic (a poisoned cache must not reach a release).

      - name: install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: version
        id: ver
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" != "$crate" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
              exit 1
            fi
          else
            version=$crate
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package (zip)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $name = "codegraph-${env:VERSION}-windows-amd64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/codegraph.exe .
          Compress-Archive -Force -Path codegraph.exe, README.md, LICENSE -DestinationPath "dist/$name"
          & ./codegraph.exe version

      - name: package (tar.gz)
        if: matrix.os != 'windows'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          name="codegraph-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/codegraph" README.md LICENSE stage/
          tar -C stage -czf "dist/$name" codegraph README.md LICENSE
          file stage/codegraph || true
          # Run it where the host can (x86_64 macOS runs under Rosetta on arm64 runners).
          if [ "${{ matrix.target }}" != "aarch64-unknown-linux-gnu" ]; then stage/codegraph version; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codegraph-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Write scopes live on this job only (top-level stays contents: read):
    # contents for the draft release, id-token + attestations for build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PUBLISH: ${{ github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: codegraph-*
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          sha256sum codegraph-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
      # SLSA build provenance for every archive (verify: gh attestation verify <file> -R <owner>/codegraph,
      # see docs/INSTALL.md). GitHub only offers attestations on public repos (or Enterprise Cloud),
      # so a release cut while the repo is still private skips it with a warning instead of failing.
      - name: build provenance attestation
        if: env.PUBLISH == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/codegraph-*
      - name: provenance unavailable
        if: env.PUBLISH == 'true' && github.event.repository.visibility != 'public'
        run: echo "::warning::repository is not public; build provenance attestation skipped (not supported on private repos without Enterprise Cloud)"
      - name: draft GitHub release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: |
            dist/codegraph-*
            dist/SHA256SUMS
          generate_release_notes: true
